name: DevSecOps

on:
  push:
    branches:
      - main

jobs:

  # Code Quality
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  # Secret Scanning
  secret-scanning:
    uses: ./.github/workflows/Secret-scanning.yml

  # Dependency Checks
  dependency-checks:
    uses: ./.github/workflows/dependency.yml

  # Docker Security Checks
  docker-checks:
    uses: ./.github/workflows/docker-scan.yml
    secrets: inherit

  #sonar Scann
  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit  

  #code test

  code-test:
    uses: ./.github/workflows/code-test.yml

  #push to Docker hub
  docker-push:
      uses: ./.github/workflows/docker-push.yml
      needs: [code-quality,  code-test, sonar-scan ,docker-checks ,dependency-checks, secret-scanning ]
      secrets: inherit 

   #------ CD ------  

  deploy:
      needs: [ docker-push ]
      uses: ./.github/workflows/CD.yml
      secrets: inherit

  dast-scan:
      needs: [ deploy ]
      uses: ./.github/workflows/dast.yml
      secrets: inherit        