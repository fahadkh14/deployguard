# Goal - Ensure the docker files and Docker images are security Tested
# Goal - To ensure my running application is free from OWASP top 10 security issues

name: Docker scan

on:
  workflow_call:

jobs:
  docker-file-lint-and-scan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folders: ['backend', 'frontend']

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: ${{ matrix.folders }} Docker Lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile
          ignore: SC2016  

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build ${{ matrix.folders }}
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/deployguard-${{ matrix.folders }}:latest .
        working-directory: ${{ matrix.folders }}
        
      # -------------------------
      # Trivy Image Security Scan
      # -------------------------
      - name: Scan ${{ matrix.folders }} Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: deployguard-${{ matrix.folders }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'