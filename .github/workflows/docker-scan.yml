# Goal - Ensure the Dockerfiles and Docker images are security tested

name: Docker Scan

# This workflow is called from the main DevSecOps workflow
on:
  workflow_call:

jobs:
  docker-file-lint-and-scan:

    # Run the job on the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Run the same security checks for backend and frontend
    strategy:
      fail-fast: false
      matrix:
        folders:
          - backend
          - frontend

    steps:

      # -----------------------------------
      # Checkout source code
      # -----------------------------------
      - name: Code Checkout
        uses: actions/checkout@v4

      # -----------------------------------
      # Lint Dockerfile using Hadolint
      # -----------------------------------
      - name: ${{ matrix.folders }} Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile

      # -----------------------------------
      # Login to Docker Hub
      # -----------------------------------
      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------
      # Build Docker image
      # -----------------------------------
      - name: Docker Build ${{ matrix.folders }}
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest \
            .
        working-directory: ${{ matrix.folders }}

      # -----------------------------------
      # Scan Docker image for vulnerabilities
      # -----------------------------------
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'