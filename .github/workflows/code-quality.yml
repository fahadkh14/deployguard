#Goal- I have to do SAST for my code

name: Code Quailty

on:
    workflow_call  # you can call this workflow before/after any other workflow

jobs:
    sast:
        runs-on: ubuntu-latest   
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Sethub NODE.js
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm Packages
              run: npm ci
              working-directory: frontend

            - name: Run Linter
              run: npm run lint
              working-directory: frontend

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: maven

            - name: Build Backend
              run: mvn clean package -DskipTests
              working-directory: backend

              
   