name: deployguard

on:
  workflow_call:


jobs:
  sonar-scan:
    name: Sonar Scanning 
    runs-on: ubuntu-latest    

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name:  SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL}}  