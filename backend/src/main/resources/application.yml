server:
  port: 8080

spring:
  application:
    name: deployguard-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deployguard}
    username: ${DB_USER:deployguard_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.deployguard: INFO
    org.hibernate.SQL: WARN

deployguard:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
